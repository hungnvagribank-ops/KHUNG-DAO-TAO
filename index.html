<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f0f4f8;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#00573F 0%,#008C5E 50%,#00A86B 100%);color:#fff;padding:24px 32px;box-shadow:0 4px 20px rgba(0,0,0,.15);position:sticky;top:0;z-index:100}
.header h1{font-size:22px;font-weight:700;margin-bottom:4px}
.header p{font-size:13px;opacity:.85}
.container{max-width:1400px;margin:0 auto;padding:24px;display:flex;gap:24px;min-height:calc(100vh - 100px)}
.left-panel{width:380px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.search-box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.search-box input{width:100%;padding:12px 16px;border:2px solid #e0e7ef;border-radius:8px;font-size:14px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:#00A86B}
.filter-bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filter-btn{padding:6px 12px;border:1px solid #d0d8e0;border-radius:20px;background:#fff;font-size:12px;cursor:pointer;transition:all .2s;color:#555}
.filter-btn:hover{background:#f0f7f4;border-color:#00A86B}
.filter-btn.active{background:#00A86B;color:#fff;border-color:#00A86B}
.position-list{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);flex:1;overflow-y:auto;max-height:calc(100vh - 260px)}
.list-header{padding:12px 16px;font-size:13px;font-weight:600;color:#666;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:2}
.unit-group{border-bottom:1px solid #f0f0f0}
.unit-group-header{padding:10px 16px;font-size:12px;font-weight:700;color:#00573F;background:#f7faf9;cursor:pointer;display:flex;align-items:center;gap:8px;position:sticky;top:40px;z-index:1}
.unit-group-header::before{content:'▸';transition:transform .2s;font-size:10px}
.unit-group-header.expanded::before{transform:rotate(90deg)}
.unit-group-count{background:#e8f5e9;color:#00573F;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-left:auto}
.pos-item{padding:10px 16px 10px 32px;cursor:pointer;transition:background .15s;border-bottom:1px solid #f8f8f8;display:none}
.pos-item:hover{background:#f0f7f4}
.pos-item.selected{background:#e8f5e9;border-left:3px solid #00A86B}
.pos-item .pos-code{font-size:11px;color:#888;font-family:Consolas,monospace}
.pos-item .pos-name{font-size:13px;font-weight:500;color:#333;margin-top:2px}
.unit-group.expanded .pos-item{display:block}
.right-panel{flex:1;min-width:0}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:400px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);color:#aab}
.placeholder .icon{font-size:64px;margin-bottom:16px}
.placeholder .text{font-size:16px}
.detail-card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;margin-bottom:20px}
.detail-header{background:linear-gradient(135deg,#00573F,#00A86B);color:#fff;padding:20px 24px}
.detail-header h2{font-size:18px;font-weight:700;margin-bottom:4px}
.detail-header .detail-meta{font-size:12px;opacity:.85;margin-top:4px}
.detail-header .detail-meta span{margin-right:16px}
.stats-row{display:flex;gap:12px;padding:16px 24px;background:#f7faf9;border-bottom:1px solid #eee;flex-wrap:wrap}
.stat-box{flex:1;min-width:120px;text-align:center;padding:12px;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.stat-box .stat-number{font-size:28px;font-weight:800;color:#00573F}
.stat-box .stat-label{font-size:11px;color:#888;margin-top:4px}
.section-title{padding:14px 24px;font-size:15px;font-weight:700;color:#00573F;background:#f9fafb;border-bottom:1px solid #eee;border-top:1px solid #eee;display:flex;align-items:center;gap:8px}
.section-title .badge{background:#00A86B;color:#fff;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600}
.course-table{width:100%;border-collapse:collapse}
.course-table th{background:#f0f4f8;padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:#555;border-bottom:2px solid #e0e7ef;white-space:nowrap}
.course-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f0f0f0;vertical-align:top}
.course-table tr:hover td{background:#fafcfb}
.course-table .col-stt{width:40px;text-align:center}
.course-table .col-name{min-width:200px}
.course-table .col-format{width:110px}
.course-table .col-duration{width:100px}
.course-table .col-timeline{width:90px}
.course-table .col-comp{width:70px;text-align:center}
.course-table .col-cert{width:50px;text-align:center}
.comp-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.comp-NLC{background:#E3F2FD;color:#1565C0}
.comp-NLCM,.comp-NCLM{background:#FFF3E0;color:#E65100}
.comp-NLQL{background:#F3E5F5;color:#7B1FA2}
.cert-yes{color:#00A86B;font-weight:700;font-size:16px}
.cert-no{color:#ddd}
.timeline-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tl-01{background:#E8F5E9;color:#2E7D32}
.tl-13{background:#FFF8E1;color:#F57F17}
.tl-dk{background:#FCE4EC;color:#C62828}
.tl-other{background:#F5F5F5;color:#616161}
.btn-print{padding:8px 20px;background:#fff;color:#00573F;border:2px solid #00573F;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;float:right;margin:16px 24px;transition:all .2s}
.btn-print:hover{background:#00573F;color:#fff}
@media print{
@page{size:A4 landscape;margin:8mm}
.header,.left-panel,.btn-print{display:none!important}
.container{padding:0;display:block}
.right-panel{width:100%}
.detail-card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;break-inside:avoid;margin-bottom:8px}
.course-table{page-break-inside:avoid}
.course-table tr{page-break-inside:avoid}
body{background:#fff}
#rightPanel{transform-origin:top left}
}
@media(max-width:900px){.container{flex-direction:column;padding:12px}.left-panel{width:100%}.position-list{max-height:300px}}

const positions = RAW_DATA.positions;
const pliCourses = RAW_DATA.pli_courses;
let currentFilter = 'all';
let selectedIdx = null;

const pliLabels = {
    'NVC': 'PLI.3 – Đào tạo chung Nhân viên',
    'LĐPC': 'PLI.4 – Đào tạo chung Lãnh đạo cấp Phòng',
    'LĐCNLII': 'PLI.5 – Đào tạo chung Lãnh đạo CN loại II',
    'LĐĐV': 'PLI.6 – Đào tạo chung Lãnh đạo Đơn vị',
};

function init() {
    renderPositionList();
}

function renderPositionList() {
    const container = document.getElementById('positionList');
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const groups = {};
    let totalVisible = 0;
    
    positions.forEach((pos, idx) => {
        if (currentFilter !== 'all') {
            if (currentFilter === 'NV' && !pos.code.includes('NV') && !pos.code.includes('GV')) return;
            if (currentFilter === 'LĐP' && !pos.code.includes('LĐP')) return;
            if (currentFilter === 'LĐĐV' && !pos.code.includes('LĐĐV')) return;
        }
        if (search) {
            const haystack = (pos.code + ' ' + pos.full_name + ' ' + pos.unit).toLowerCase();
            if (!haystack.includes(search)) return;
        }
        const unit = pos.unit || 'Khác';
        if (!groups[unit]) groups[unit] = [];
        groups[unit].push({ ...pos, idx });
        totalVisible++;
    });
    
    let html = `<div class="list-header">${totalVisible} vị trí</div>`;
    for (const [unit, items] of Object.entries(groups)) {
        const expanded = search || Object.keys(groups).length <= 3 ? 'expanded' : '';
        html += `<div class="unit-group ${expanded}">`;
        html += `<div class="unit-group-header ${expanded}" onclick="toggleGroup(this)">${unit} <span class="unit-group-count">${items.length}</span></div>`;
        items.forEach(pos => {
            const sel = selectedIdx === pos.idx ? 'selected' : '';
            html += `<div class="pos-item ${sel}" onclick="selectPosition(${pos.idx})">
                <div class="pos-code">${pos.code}</div>
                <div class="pos-name">${pos.full_name}</div>
            </div>`;
        });
        html += `</div>`;
    }
    container.innerHTML = html;
}

function toggleGroup(el) {
    el.parentElement.classList.toggle('expanded');
    el.classList.toggle('expanded');
}

function setFilter(btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPositionList();
}

function filterPositions() { renderPositionList(); }

function getTimelineClass(tl) {
    if (!tl) return 'tl-other';
    if (tl.includes('0-1')) return 'tl-01';
    if (tl.includes('1-3')) return 'tl-13';
    if (tl.toLowerCase().includes('định kỳ')) return 'tl-dk';
    return 'tl-other';
}

function renderCourseTable(courses, title, badgeCount) {
    if (!courses || courses.length === 0) return '';
    let html = `<div class="section-title">${title} <span class="badge">${badgeCount} chuyên đề</span></div>`;
    html += `<div style="overflow-x:auto"><table class="course-table">
        <thead><tr>
            <th class="col-stt">STT</th>
            <th class="col-name">Tên chuyên đề</th>
            <th class="col-format">Hình thức</th>
            <th class="col-duration">Thời lượng</th>
            <th class="col-timeline">Lộ trình</th>
            <th class="col-comp">Năng lực</th>
            <th class="col-cert">QH</th>
            <th class="col-cert">BN</th>
            <th class="col-cert">BN lại</th>
        </tr></thead><tbody>`;
    courses.forEach((c, i) => {
        const compClass = 'comp-' + (c.competency || '').replace(/\s/g,'');
        const tlClass = getTimelineClass(c.timeline);
        html += `<tr>
            <td class="col-stt">${i+1}</td>
            <td class="col-name">${c.name}</td>
            <td class="col-format">${c.format || '—'}</td>
            <td class="col-duration">${c.duration || '—'}</td>
            <td class="col-timeline"><span class="timeline-badge ${tlClass}">${c.timeline || '—'}</span></td>
            <td class="col-comp"><span class="comp-badge ${compClass}">${c.competency || '—'}</span></td>
            <td class="col-cert">${c.cert_qh ? '<span class="cert-yes">✓</span>' : '<span class="cert-no">—</span>'}</td>
            <td class="col-cert">${c.cert_bn ? '<span class="cert-yes">✓</span>' : '<span class="cert-no">—</span>'}</td>
            <td class="col-cert">${c.cert_bn_lai ? '<span class="cert-yes">✓</span>' : '<span class="cert-no">—</span>'}</td>
        </tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
}

function selectPosition(idx) {
    selectedIdx = idx;
    renderPositionList();
    const pos = positions[idx];
    const panel = document.getElementById('rightPanel');
    const pliLevel = pos.pli_level;
    const pliCourseList = pliLevel ? (pliCourses[pliLevel] || []) : [];
    const pliLabel = pliLabels[pliLevel] || ('PLI – Đào tạo chung');
    const specificCourses = pos.courses || [];
    const totalCourses = pliCourseList.length + specificCourses.length;
    const allCourses = [...pliCourseList, ...specificCourses];
    let tl01=0,tl13=0,tldk=0;
    allCourses.forEach(c => {
        if (c.timeline && c.timeline.includes('0-1')) tl01++;
        else if (c.timeline && c.timeline.includes('1-3')) tl13++;
        else if (c.timeline && c.timeline.toLowerCase().includes('định kỳ')) tldk++;
    });
    
    let html = `<div class="detail-card">
        <div class="detail-header">
            <h2>${pos.full_name}</h2>
            <div class="detail-meta">
                <span>📌 Mã: ${pos.code}</span>
                <span>🏢 ${pos.unit || 'N/A'}</span>
            </div>
        </div>
        <button class="btn-print" onclick="printOnePage()">🖨️ In / Xuất PDF (1 trang)</button>
        <div class="stats-row">
            <div class="stat-box"><div class="stat-number">${totalCourses}</div><div class="stat-label">Tổng chuyên đề</div></div>
            <div class="stat-box"><div class="stat-number">${tl01}</div><div class="stat-label">Giai đoạn 0-1 năm</div></div>
            <div class="stat-box"><div class="stat-number">${tl13}</div><div class="stat-label">Giai đoạn 1-3 năm</div></div>
            <div class="stat-box"><div class="stat-number">${tldk}</div><div class="stat-label">Định kỳ hàng năm</div></div>
        </div>`;
    
    if (pliCourseList.length > 0) {
        html += renderCourseTable(pliCourseList, '📘 ' + pliLabel, pliCourseList.length);
    }
    if (specificCourses.length > 0) {
        html += renderCourseTable(specificCourses, '📗 Đào tạo theo vị trí chức danh', specificCourses.length);
    }
    html += `</div>`;
    html += `<div class="detail-card" style="padding:16px 24px">
        <div style="font-size:13px;color:#666">
            <strong>Chú thích:</strong>
            <span class="comp-badge comp-NLC" style="margin-left:8px">NLC</span> Năng lực chung &nbsp;
            <span class="comp-badge comp-NLCM" style="margin-left:8px">NLCM</span> Năng lực chuyên môn &nbsp;
            <span class="comp-badge comp-NLQL" style="margin-left:8px">NLQL</span> Năng lực quản lý &nbsp;|&nbsp;
            <strong>QH</strong> = Quy hoạch &nbsp;
            <strong>BN</strong> = Bổ nhiệm &nbsp;
            <strong>BN lại</strong> = Bổ nhiệm lại
        </div>
    </div>`;
    panel.innerHTML = html;
}

function printOnePage() {
    const printArea = document.getElementById('rightPanel');
    if (!printArea) { window.print(); return; }
    // reset trước khi đo
    printArea.style.transform = '';
    printArea.style.width = '';
    // kích thước vùng in A4 ngang, trừ margin 8mm mỗi bên (~30px @96dpi)
    const pageWidthPx = 1080;
    const pageHeightPx = 720;
    const contentWidth = printArea.scrollWidth;
    const contentHeight = printArea.scrollHeight;
    let scale = Math.min(pageWidthPx / contentWidth, pageHeightPx / contentHeight, 1);
    if (scale < 0.35) scale = 0.35; // giới hạn để chữ không quá nhỏ, có thể tràn nhẹ nếu quá nhiều dữ liệu
    printArea.style.transform = `scale(${scale})`;
    printArea.style.width = (100 / scale) + '%';
    window.print();
}

window.onafterprint = function () {
    const printArea = document.getElementById('rightPanel');
    if (printArea) {
        printArea.style.transform = '';
        printArea.style.width = '';
    }
};

init();

</script>
